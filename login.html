<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Stackly Crypto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Section 1 : Auth card -->
<section class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <button class="auth-back" id="authBack"><i class="fa-solid fa-arrow-left"></i> Back</button>

  <div class="auth-card" data-reveal="zoom">
    <a href="index.html" class="auth-logo logo" style="justify-content:center">
      <svg class="logo-mark" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="lgA" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#a855f7"/></linearGradient><linearGradient id="lgB" x1="48" y1="0" x2="0" y2="48"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><path d="M24 2 42 12.5v23L24 46 6 35.5v-23L24 2Z" fill="url(#lgA)"/><path d="M15 18.5h13.5a4.7 4.7 0 0 1 0 9.4H19a4.7 4.7 0 0 0 0 9.4H33" stroke="#fff" stroke-width="4.4" stroke-linecap="round" fill="none"/><path d="M24 2 42 12.5 24 23 6 12.5 24 2Z" fill="url(#lgB)" opacity=".85"/></svg>
      <span class="logo-text"><b>STACKLY</b><span>CRYPTO</span></span>
    </a>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to access your Stackly dashboard</p>

    <div class="auth-msg" id="authMsg"></div>

    <div class="role-select" id="roleSelect">
      <div class="role-option" data-role="user"><i class="fa-solid fa-user"></i><b>User</b><small>Buyer dashboard</small></div>
      <div class="role-option" data-role="admin"><i class="fa-solid fa-user-tie"></i><b>Admin</b><small>Seller dashboard</small></div>
    </div>
    <input type="hidden" id="roleInput" value="">

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        <span class="err-msg"></span>
      </div>
      <div class="form-group">
        <label for="loginPwd">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="loginPwd" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwd-toggle"><i class="fa-solid fa-eye"></i></button>
        </div>
        <span class="err-msg"></span>
      </div>
      <button type="submit" class="btn btn-primary auth-btn">Log In <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div style="display:flex;gap:14px">
      <a href="404.html" class="btn btn-outline" style="flex:1;justify-content:center;padding:13px"><i class="fa-brands fa-google" style="color:#ea4335"></i> Google</a>
      <a href="404.html" class="btn btn-outline" style="flex:1;justify-content:center;padding:13px"><i class="fa-brands fa-apple"></i> Apple</a>
    </div>

    <p class="auth-alt" style="margin-top:24px">Don't have an account? <a href="register.html">Create one free</a></p>
    <p class="auth-alt" style="margin-top:10px"><a href="404.html">Forgot your password?</a></p>
  </div>
</section>


<script src="js/main.js"></script>
<script>
  // Back button — always go to Home page
  document.getElementById("authBack").addEventListener("click", function () {
    window.location.href = "index.html";
  });
</script>
</body>
</html>
