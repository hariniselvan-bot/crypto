</a>

<i class="fa-solid fa-star err-star" style="top:14%;left:12%;font-size:22px"></i>
<i class="fa-solid fa-star err-star" style="top:24%;right:14%;font-size:16px;animation-delay:.6s"></i>
<i class="fa-solid fa-star err-star" style="bottom:20%;left:18%;font-size:14px;animation-delay:1.1s"></i>
<i class="fa-solid fa-star err-star" style="bottom:28%;right:10%;font-size:20px;animation-delay:1.6s"></i>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<img src="images/404-crypto_11zon.webp" alt="Lost in the crypto galaxy" class="err-img">
<span class="err-tag">Error 404 — Page Not Found</span>
<div class="err-code">404</div>
<h2>Oops! This page drifted into deep space</h2>
<p>The page you're looking for doesn't exist or is still being built. Don't worry — our navigator can take you right back to where you were.</p>
<div class="err-actions">
  <button class="btn btn-primary" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
  <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Back to Home</a>
</div>

<script>
  // "Go Back" returns to the exact previous page & section the visitor came from.
  // Every page stores its URL in sessionStorage; fall back to history, then home.
  document.getElementById("backBtn").addEventListener("click", function () {
    var last = null;
    try { last = sessionStorage.getItem("stackly_last"); } catch (e) {}
    if (last && last.indexOf("404.html") === -1) {
      window.location.href = last;
    } else if (window.history.length > 1 && document.referrer) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  });
</script>
</body>
</html>
