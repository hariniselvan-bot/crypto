<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Stackly Crypto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="err-page">

<a href="index.html" class="err-logo logo">
  <img class="logo-mark" src="images/logo.webp" alt="Stackly Crypto logo">
  <span class="logo-text"><b>STACKLY</b><span>CRYPTO</span></span>
</a>

<i class="fa-solid fa-star err-star" style="top:14%;left:12%;font-size:22px"></i>
<i class="fa-solid fa-star err-star" style="top:24%;right:14%;font-size:16px;animation-delay:.6s"></i>
<i class="fa-solid fa-star err-star" style="bottom:20%;left:18%;font-size:14px;animation-delay:1.1s"></i>
<i class="fa-solid fa-star err-star" style="bottom:28%;right:10%;font-size:20px;animation-delay:1.6s"></i>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<img src="images/404-crypto_11zon.webp" alt="Lost in the crypto galaxy" class="err-img">
<span class="err-tag">Error 404 — Page Not Found</span>
<div class="err-code">404</div>
<h2>Oops! This page drifted into deep space</h2>
<p>The page you're looking for doesn't exist or is still being built. Don't worry — our navigator can take you right back to where you were.</p>
<div class="err-actions">
  <button class="btn btn-primary" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
  <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Back to Home</a>
</div>

<script>
  function readLastPage() {
    try {
      const raw = sessionStorage.getItem("stackly_last");
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  document.getElementById("backBtn").addEventListener("click", function () {
    var last = readLastPage();
    var lastUrl = last && last.url ? last.url : null;

    if (lastUrl && lastUrl.indexOf("404.html") === -1) {
      sessionStorage.removeItem("stackly_resume_scroll");
      if (last && last.hash) {
        window.location.assign(lastUrl + last.hash);
      } else {
        window.location.assign(lastUrl);
      }
    } else if (window.history.length > 1 && document.referrer) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  });
</script>
</body>
</html>
